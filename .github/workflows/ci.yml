name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: every commit there must be verified in its own right
  # (docs/01 rule 2 and 05 section 6). On other branches, superseded runs are wasted work.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The workflow reads the repository and nothing more (the owner's audit Q-03, D-084).
permissions:
  contents: read

env:
  # Node 24 LTS, supported until 30/04/2028; Node 20 reached its end of life on 30/04/2026
  # (https://endoflife.date/nodejs; the owner's audit Q-01, D-084).
  NODE_VERSION: '24'

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    # The queue tests (ARB-030) run against a real Redis; BullMQ is Lua inside Redis and
    # has no meaningful fake.
    # The production pool and the three processes' start and stop (ARB-510) run against a
    # real Postgres; every other test uses PGlite.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A known high or critical vulnerability in any dependency fails the build (Q-05).
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: No browser automation (ARB-300)
        run: sh scripts/check-no-browser-automation.sh

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck the end-to-end tests (Q-04)
        run: pnpm typecheck:e2e

      - name: Unit and integration tests
        run: pnpm test

  secrets:
    name: Secret scan
    # docs/05 section 4.2 and the owner's audit Q-02: no secret anywhere in the history.
    # gitleaks is run as its released binary, pinned by version and checksum (D-084).
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --verbose .

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the web app in e2e mode (stand-in Supabase and API URLs the specs intercept)
        run: pnpm build:web:e2e

      - name: Run Playwright tests
        run: pnpm exec playwright test --config e2e/playwright.config.ts

      # ARB-440's acceptance: Lighthouse at 90 or more in every category on the public
      # pages of the build above, in the Chromium installed for the end-to-end tests.
      - name: Lighthouse on the public pages (ARB-440)
        run: pnpm -s lighthouse

      # D-043: demo mode must never reach a real build. The e2e build above is a real
      # build with stand-in hosts, so the demo stand-in must be absent from it.
      - name: Check that a non-demo build carries no demo code
        run: |
          if grep -rl "demo-access-token" apps/web/dist; then
            echo "demo code found in a non-demo build" >&2
            exit 1
          fi

      - name: Build the demo web app (what Vercel serves without credentials, D-043)
        run: pnpm build:web:demo

      - name: Run the demo Playwright tests
        run: pnpm exec playwright test --config e2e/playwright.demo.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  compose:
    name: docker compose up healthy
    # ARB-004's acceptance, on every push: the local stack starts and every service
    # passes its own health check. The build container cannot pull the Postgres image
    # (its registry download hosts are outside its egress policy), so this is where
    # the clause is proven (D-037).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start the stack and wait for every health check
        run: docker compose up -d --wait --wait-timeout 240

      # db:seed runs the TypeScript seed builder with tsx, so this job needs the workspace.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ARB-010's clause: `pnpm db:reset` recreates the Postgres service with an empty
      # volume, applies every migration and seeds (D-038).
      - name: Reset the database, applying every migration and the seed (ARB-010)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: |
          pnpm db:reset
          psql "$DATABASE_URL" -X -A -t -c "select count(*) || ' public tables' from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'"
          psql "$DATABASE_URL" -X -A -t -c "select 'pgsodium available: ' || count(*)::text from pg_available_extensions where name = 'pgsodium'"

      # ARB-013's clause "seed idempotent": a second run changes nothing. The taxonomy is
      # the spec's 22 categories and no price band is invented (D-14).
      - name: Seed a second time and check nothing changed (ARB-013)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: |
          pnpm db:seed
          categories=$(psql "$DATABASE_URL" -X -A -t -c "select count(*) from service_categories")
          bands=$(psql "$DATABASE_URL" -X -A -t -c "select count(*) from market_price_bands")
          echo "service_categories: $categories, market_price_bands: $bands"
          test "$categories" = 22
          test "$bands" = 0

      # ARB-020 and V-02: the test suites use a Vault shim that does not encrypt; this runs
      # the token functions against the real Vault extension in the Supabase image (D-041).
      - name: Prove marketplace tokens are encrypted at rest by Vault (ARB-020)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: psql "$DATABASE_URL" -X -q -f scripts/db-verify-vault.sql

      - name: Show the services, and the logs of any that did not come up
        if: ${{ always() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 120

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v
