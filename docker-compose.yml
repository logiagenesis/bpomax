# Local development dependencies for Arbitron (docs/04 ARB-004).
#
# Redis backs BullMQ (docs/01 section C). Postgres is the supabase/postgres image,
# which carries the extensions the migrations need, including pgsodium for token
# encryption. The full Supabase stack (Auth, Storage, Studio, PostgREST) is run with
# the Supabase CLI — `supabase start` — which orchestrates its own containers; see
# README.md and DECISIONS.md D-006.

services:
  redis:
    # Overridable so a registry mirror can stand in when Docker Hub is out of reach
    # (D-036); unset, the images are exactly the ones named here.
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: arbitron-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: ${POSTGRES_IMAGE:-supabase/postgres:15.8.1.060}
    container_name: arbitron-postgres
    # The image's own init script runs as supabase_admin, creates the postgres role with
    # POSTGRES_PASSWORD, and sets up the auth, extensions and pgsodium schemas. So
    # POSTGRES_USER is left at the image's default, and the database is `postgres`, the
    # same name and port (54322) the Supabase CLI uses locally (D-037).
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '54322:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h localhost']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  redis-data:
  # Named outright so `pnpm db:reset` can drop it whatever the checkout's folder is called.
  postgres-data:
    name: arbitron-postgres-data
