<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create an account — Arbitron</title>
    <link rel="stylesheet" href="./styles/app.css" />
    <script type="module" src="./signup.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="container app-header__inner">
        <a class="app-header__brand" href="./index.html">Arbitron</a>
      </div>
    </header>

    <main class="container page">
      <form id="signup" class="card stack login" novalidate aria-labelledby="signup-heading">
        <h1 id="signup-heading">Create an account</h1>
        <p>
          You will set up your own organisation next. Nothing you add is visible to anyone outside
          it.
        </p>
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input
            class="input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            aria-describedby="email-error"
          />
          <p class="field__error" id="email-error" hidden></p>
        </div>
        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            aria-describedby="password-error"
          />
          <p class="field__error" id="password-error" hidden></p>
        </div>
        <div class="field">
          <label class="field__label" for="confirm">Password again</label>
          <input
            class="input"
            id="confirm"
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
            aria-describedby="confirm-error"
          />
          <p class="field__error" id="confirm-error" hidden></p>
        </div>
        <div class="field">
          <label class="check">
            <input type="checkbox" id="terms" name="terms" aria-describedby="terms-error" />
            <span id="terms-label">I accept the <a href="./terms.html">terms of service</a></span>
          </label>
          <p class="field__error" id="terms-error" hidden></p>
        </div>
        <div class="cluster">
          <button type="submit" class="btn btn--primary" id="submit">Create account</button>
        </div>
        <div role="status" aria-live="polite" id="status"></div>
        <p>Already have an account? <a href="./login.html">Sign in</a></p>
      </form>
      <p class="section-note"><a href="./privacy.html">Privacy notice</a></p>
    </main>
  </body>
</html>
